<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="erro-page">

    <main class="erro-main">

        <div class="feedback-card">

            <div class="icone-erro">✕</div>

            <h1>NÃO FOI DESSA VEZ!</h1>

            <p class="subtitulo">TENTE NOVAMENTE NA PRÓXIMA!</p>

            <div class="dica-box">
                <h3>DICA</h3>
                <h4 id="dica-texto"></h4>
            </div>

        </div>

        <button class="btn-red" onclick="tentarNovamente()">
            TENTAR NOVAMENTE
        </button>

        <button class="btn-yellow" onclick="continuar()">
            CONTINUAR
        </button>

    </main>

    <script src="script.js"></script>
    <script>
        (function () {
            const dicaElemento = document.getElementById("dica-texto");
            const indice = Number(localStorage.getItem("perguntaAtual")) || 0;

            if (!dicaElemento || !Array.isArray(perguntas) || !perguntas[indice]) {
                return;
            }

            dicaElemento.textContent = perguntas[indice].dica || "";
        })();
    </script>

</body>

</html>
