<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pergunta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pergunta-page">

<header class="topo-jogo">

    <div class="info-jogador">👤 JOGADOR</div>
    <div class="info-pontos">⭐ PONTOS: 0</div>
    <div class="info-pergunta">❓ 1/15</div>

</header>

<main class="pergunta-main">

    <div class="topo">
        <a href="index.html" class="btn-voltar">←</a>
    </div>

    <section class="card-pergunta">

        <h1 id="pergunta"></h1>

        <div class="opcoes">

            <button class="opcao-btn" onclick="verificarResposta(0)">
                <h2 id="texto0"></h2>
                <img id="img0" alt="Opção 1">
            </button>

            <button class="opcao-btn" onclick="verificarResposta(1)">
                <h2 id="texto1"></h2>
                <img id="img1" alt="Opção 2">
            </button>

            <button class="opcao-btn" onclick="verificarResposta(2)">
                <h2 id="texto2"></h2>
                <img id="img2" alt="Opção 3">
            </button>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
