<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brusque: Jogo de Perguntas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <div class="brand" aria-label="Título do jogo">
          <span class="brand__title">Brusque</span>
          <span class="brand__subtitle">Jogo para crianças</span>
        </div>
      </header>

      <section id="view-welcome" class="view is-active" aria-label="Tela de boas-vindas">
        <div class="panel">
          <h1 class="title">Vamos brincar e conhecer Brusque?</h1>
          <p class="subtitle">Preencha para começar</p>

          <form id="welcomeForm" class="form" autocomplete="off">
            <label class="field">
              <span class="field__label">Nome</span>
              <input id="inputNome" class="field__input" type="text" inputmode="text" placeholder="Seu nome" required />
            </label>

            <label class="field">
              <span class="field__label">Escola</span>
              <input id="inputEscola" class="field__input" type="text" inputmode="text" placeholder="Sua escola" required />
            </label>

            <label class="field">
              <span class="field__label">Idade</span>
              <input
                id="inputIdade"
                class="field__input"
                type="number"
                inputmode="numeric"
                min="1"
                max="99"
                placeholder="Ex.: 5"
                required
              />
            </label>

            <button id="btnComecar" class="btn btn--primary btn--lg" type="submit" disabled>Começar</button>
          </form>
        </div>
      </section>

      <section id="view-quiz" class="view" aria-label="Tela do jogo">
        <div class="panel panel--wide">
          <div class="hud" aria-label="Informações do jogo">
            <div class="hud__item">
              <div class="hud__label">Jogador</div>
              <div id="hudJogador" class="hud__value">—</div>
            </div>
            <div class="hud__item">
              <div class="hud__label">Pontos</div>
              <div id="hudPontos" class="hud__value">0</div>
            </div>
            <div class="hud__item">
              <div class="hud__label">Pergunta</div>
              <div id="hudProgresso" class="hud__value">0/0</div>
            </div>
          </div>

          <div class="question">
            <h2 id="quizPergunta" class="question__text">—</h2>
            <div id="quizOpcoes" class="options" role="list" aria-label="Opções de resposta"></div>
          </div>
        </div>
      </section>

      <section id="view-final" class="view" aria-label="Tela final">
        <div class="panel">
          <h2 class="title">Fim do jogo!</h2>
          <p id="finalMensagem" class="subtitle">—</p>
          <div class="finalBox" aria-label="Resumo">
            <div class="finalBox__row">
              <span class="finalBox__label">Pontos</span>
              <strong id="finalPontos" class="finalBox__value">0</strong>
            </div>
            <div class="finalBox__row">
              <span class="finalBox__label">Total de perguntas</span>
              <strong id="finalTotal" class="finalBox__value">0</strong>
            </div>
          </div>
          <button id="btnReiniciar" class="btn btn--primary btn--lg" type="button">Jogar de novo</button>
        </div>
      </section>

      <div id="overlayAcerto" class="overlay" hidden aria-hidden="true">
        <div class="overlay__content overlay__content--success" role="dialog" aria-modal="true" aria-label="Feedback de acerto">
          <div class="overlay__title">Parabéns, você acertou!</div>
          <button id="btnAcertoContinuar" class="btn btn--dark btn--lg" type="button">Continuar</button>
        </div>
      </div>

      <div id="overlayErro" class="overlay" hidden aria-hidden="true">
        <div class="overlay__content overlay__content--warning" role="dialog" aria-modal="true" aria-label="Feedback de erro">
          <div class="overlay__title">Não foi dessa vez, tente novamente na próxima</div>
          <div class="hint" aria-label="Dica">
            <div class="hint__label">DICA</div>
            <div id="erroDica" class="hint__text">—</div>
          </div>
          <div class="overlay__actions">
            <button id="btnErroTentar" class="btn btn--dark btn--lg" type="button">Tentar novamente</button>
            <button id="btnErroContinuar" class="btn btn--dark btn--lg" type="button">Continuar</button>
          </div>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
